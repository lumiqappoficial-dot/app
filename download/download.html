<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumiq – Descargar APK v1.0.1</title>
<meta name="description" content="Descarga Lumiq versión 1.0.1 para Android. Chat, billetera, compras, delivery, transporte y pago de servicios en una sola app.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:#eef2ff;
    background:radial-gradient(1200px 600px at 80% -10%,#2b1fb8 0%,transparent 60%),
               radial-gradient(900px 500px at -10% 10%,#0b3bd1 0%,transparent 55%),
               #050a2e;
    min-height:100vh; line-height:1.6;
  }
  .container{max-width:560px;margin:0 auto;padding:40px 20px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 24px;
    background:linear-gradient(135deg,#22d3ee,#7c4dff);display:grid;place-items:center;
    box-shadow:0 0 24px rgba(34,211,238,.5);font-weight:800;font-size:1.5rem}
  h1{font-size:1.8rem;margin-bottom:12px}
  p.sub{color:#9db0ff;margin-bottom:32px;font-size:1rem}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;
    background:linear-gradient(135deg,#2a6bff,#7c4dff);color:#fff;font-weight:700;
    font-size:1.1rem;text-decoration:none;box-shadow:0 0 24px rgba(42,107,255,.55);
    transition:.25s;border:none;cursor:pointer}
  .btn:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(124,77,255,.75)}
  .meta{margin-top:28px;color:#9db0ff;font-size:.85rem}
  .back{display:inline-block;margin-top:16px;color:#22d3ee;text-decoration:none;font-size:.9rem}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="container">
    <div class="logo">L</div>
    <h1>Descarga Lumiq</h1>
    <p class="sub">Versión 1.0.1 · Android · Instalación directa con APK</p>
    <a id="btnDescarga" class="btn" href="../versiones/v1.0.1/app-debug.apk" download>
      ⬇ Descargar APK
    </a>
    <p class="meta">Tamaño: ~24 MB · Requiere Android 7.0+</p>
    <a class="back" href="../index.html">← Volver al inicio</a>
  </div>
  <script>
    var btn = document.getElementById('btnDescarga');
    btn.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      var link = document.createElement('a');
      link.href = href;
      link.download = 'Lumiq_v1.0.1.apk';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
